<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141722"/>
      <stop offset="100%" stop-color="#07080B"/>
    </radialGradient>
    <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Rounded Container -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="113" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Subtle Halo -->
  <circle cx="256" cy="235" r="160" fill="url(#haloGrad)" />

  <!-- Brain Vector Outline Group -->
  <g transform="translate(256, 225) scale(1.15) translate(-100, -90)" filter="url(#glow)">
    <!-- Left Hemisphere -->
    <path
      d="M95 30 C 72 30, 52 45, 52 68 C 38 72, 28 88, 30 104 C 20 114, 18 132, 26 146 C 36 162, 54 168, 70 162 C 78 174, 94 176, 95 160 Z"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="12"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 52 104 C 68 104, 78 114, 95 114"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="10"
      stroke-linecap="round"
    />
    
    <!-- Right Hemisphere -->
    <path
      d="M105 30 C 128 30, 148 45, 148 68 C 162 72, 172 88, 170 104 C 180 114, 182 132, 174 146 C 164 162, 146 168, 130 162 C 122 174, 106 176, 105 160 Z"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="12"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 148 104 C 132 104, 122 114, 105 114"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="10"
      stroke-linecap="round"
    />
  </g>

  <!-- Frosted Illuminated Glass Pill Base underneath brain -->
  <rect x="156" y="340" width="200" height="42" rx="21" fill="rgba(255, 255, 255, 0.12)" stroke="rgba(255, 255, 255, 0.35)" stroke-width="2" />
  <ellipse cx="256" cy="358" rx="80" ry="12" fill="#FFFFFF" opacity="0.25" filter="url(#glow)" />
</svg>
